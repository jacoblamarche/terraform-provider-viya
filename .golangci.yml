version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # The credentials in viyamock are those of a fake deployment.
        - G101
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          # The test helpers close the bodies of the responses they return.
          - bodyclose
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jacoblamarche/terraform-provider-viya
